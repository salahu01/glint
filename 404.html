s in use. No microphone permission: it only reads device state.","Calm Mode: Swaps the alarm-style bursts for gentle depletion, so you stay aware without the anxiety.","Five colour themes: Indigo, Midnight, Forest, Slate and Crimson. Three sizes, three flash strengths, 12 or 24 hour.","Launch at login: One toggle and Glint is always there. Drag it to any corner; it remembers everything."],"author":{"@id":"https://salahu01.github.io/glint/#author"}},{"@type":"FAQPage","@id":"https://salahu01.github.io/glint/#faq","mainEntity":[{"@type":"Question","name":"What is Glint?","acceptedAnswer":{"@type":"Answer","text":"Glint is a free, open-source macOS clock for people who lose track of time. It floats above every window, ticks like a real mechanical clock, and flashes in bold colour when a minute or hour changes, so you feel time passing without having to remember to look."}},{"@type":"Question","name":"Does Glint help with time blindness or ADHD?","acceptedAnswer":{"@type":"Answer","text":"Glint was built for people who look up and realise hours have vanished, including many people with ADHD or time blindness. It makes time ambient: a warm wash before each minute ends, a flash and chime when it changes, interval nudges, and a visual depletion dial inspired by research on number-free timers. It is a tool, not a medical treatment."}},{"@type":"Question","name":"Is Glint free?","acceptedAnswer":{"@type":"Answer","text":"Yes. Glint is completely free and open source under the MIT licence. No ads, subscriptions, in-app purchases or accounts."}},{"@type":"Question","name":"Which Macs and macOS versions does Glint support?","acceptedAnswer":{"@type":"Answer","text":"Glint runs on macOS 13 Ventura and newer, on both Apple silicon and Intel Macs. The download is a universal app of about 3.5 MB."}},{"@type":"Question","name":"Will the ticking get into my video calls?","acceptedAnswer":{"@type":"Answer","text":"Not if you turn on Auto-Mute in Calls. Glint silences itself while your microphone is in use. It checks only whether the input device is running, so it needs no microphone permission and never hears anything. You can also mute ticking any time with ⌘M."}},{"@type":"Question","name":"Can Glint work as a Pomodoro or focus timer?","acceptedAnswer":{"@type":"Answer","text":"Yes. Start a 25 or 50 minute focus block from the menu bar. The countdown shows on the clock face, the depletion ring or dial empties as you go, and Glint blinks and chimes when the block ends."}},{"@type":"Question","name":"Does Glint collect any data?","acceptedAnswer":{"@type":"Answer","text":"No. Glint makes no network requests and has no analytics or accounts. Its only stored data is your preferences, kept on your Mac."}},{"@type":"Question","name":"Why does macOS warn me the first time I open it?","acceptedAnswer":{"@type":"Answer","text":"Glint isn't notarised by Apple yet, which needs a paid developer account. Right-click Glint in Applications → Open → Open, once. On macOS 15 and later you may need System Settings → Privacy & Security → Open Anyway. The source code is public, so you can also build it yourself."}}]},{"@type":"HowTo","@id":"https://salahu01.github.io/glint/#install","name":"How to install Glint on a Mac","totalTime":"PT1M","step":[{"@type":"HowToStep","position":1,"name":"Download","text":"Download the latest Glint .dmg from GitHub Releases."},{"@type":"HowToStep","position":2,"name":"Install","text":"Open the .dmg and drag Glint into your Applications folder."},{"@type":"HowToStep","position":3,"name":"Open","text":"Open Glint. The clock appears in the top-right corner and its settings live in the menu bar. On first launch, if macOS cannot verify the developer, right-click Glint → Open → Open."}]}]}</script><script src="/glint/_next/static/chunks/3l04zcqx63h3y.js" id="_R_" async=""></script><script>(self.__next_f=self.__next_f||[]).push([0])</script><script>self.__next_f.push([1,"1:\"$Sreact.fragment\"\n2:I[39756,[\"/glint/_next/static/chunks/3fn
